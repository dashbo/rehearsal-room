apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rehearsal-room

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: rehearsal-room

# Bump the tag here on each release instead of editing deployment.yaml.
images:
  - name: ghcr.io/dashbo/rehearsal-room
    newTag: "0.1.0"
