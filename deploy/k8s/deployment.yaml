apiVersion: apps/v1
kind: Deployment
metadata:
  name: rehearsal-room
  labels:
    app: rehearsal-room
spec:
  replicas: 1
  # SQLite lives on one RWO volume — never run two pods against it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rehearsal-room
  template:
    metadata:
      labels:
        app: rehearsal-room
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001 # make the mounted PVC writable by the app user
      containers:
        - name: app
          image: ghcr.io/dashbo/rehearsal-room:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "file:/app/data/prod.db"
            - name: STORAGE_DIR
              value: "/app/data/storage"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rehearsal-room-data
        - name: next-cache
          emptyDir: {}
